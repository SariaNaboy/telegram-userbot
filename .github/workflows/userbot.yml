name: Run Userbot

on:
  workflow_dispatch:

jobs:
  bot2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyrogram tgcrypto

      - name: Run Bot2 (4.5 hours)
        run: timeout 16200 python -u bot2.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING2 }}
          PYTHONUNBUFFERED: "1"
          admin_username: ${{ secrets.admin_username }}

  bot3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyrogram tgcrypto

      - name: Run Bot3 (4.5 hours)
        run: timeout 16200 python -u bot3.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING3 }}
          PYTHONUNBUFFERED: "1"
          admin_username: ${{ secrets.admin_username }}
