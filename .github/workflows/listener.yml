name: Message Listener (5 min)

on:
  workflow_dispatch:

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyrogram tgcrypto
      - name: Listen for incoming messages (5 minutes)
        run: timeout 300 python -u listener.py || [ "$?" -eq 124 ]
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING5 }}
          PYTHONUNBUFFERED: "1"
