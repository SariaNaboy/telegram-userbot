name: Run Main + Bot2

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration in hours (e.g. 1.5)'
        required: true
        default: '1.5'

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      DURATION_HOURS: ${{ inputs.duration_hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyrogram tgcrypto
      - name: Run Main (timed)
        run: |
          SECS=$(python3 -c "print(int(float('$DURATION_HOURS')*3600))")
          echo "Running for $SECS seconds"
          timeout "$SECS" python -u main.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          PYTHONUNBUFFERED: "1"
          admin_username: ${{ secrets.admin_username }}

  bot2:
    runs-on: ubuntu-latest
    env:
      DURATION_HOURS: ${{ inputs.duration_hours }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyrogram tgcrypto
      - name: Run Bot2 (timed)
        run: |
          SECS=$(python3 -c "print(int(float('$DURATION_HOURS')*3600))")
          echo "Running for $SECS seconds"
          timeout "$SECS" python -u bot2.py
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING2 }}
          PYTHONUNBUFFERED: "1"
          admin_username: ${{ secrets.admin_username }}
