name: Check Secret

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect SESSION_STRING secret
        env:
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import os, base64
          s = os.environ.get("SESSION_STRING", "")
          print("len:", len(s))
          print("prefix:", s[:6])
          print("suffix:", s[-6:])
          print("has_trailing_newline:", s.endswith("\n"))
          try:
              raw = base64.urlsafe_b64decode(s + "=" * (-len(s) % 4))
              print("base64: VALID, decoded", len(raw), "bytes")
              print("dc_id:", raw[0] if len(raw) >= 1 else "?")
          except Exception as e:
              print("base64: INVALID ->", e)
          print("API_ID:", repr(os.environ.get("API_ID")))
          print("API_HASH:", os.environ.get("API_HASH"))
          PY
